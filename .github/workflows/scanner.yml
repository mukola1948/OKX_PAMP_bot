# =============================================================================
# .github/workflows/scanner.yml
# OKX_PAMP_bot — автозапуск кожні 15 хвилин через GitHub Actions
#
# ЗМІНА 10.08.2026: додано два секрети (GATE_DISPATCH_TOKEN,
# GATE_TARGET_OWNER) у Крок 4 — потрібні для відправки
# repository_dispatch у приватний репозиторій OKX_PA3OM_3_bot при
# Gate-тригері (функція send_gate_dispatch() у scanner.py).
# =============================================================================

name: OKX PAMP Scanner

# ВИПРАВЛЕНО 13.08.2026: без цього блоку github-actions[bot] отримує
# від GitHub лише права READ за замовчуванням і не може запушити
# state.json назад у репозиторій (помилка "403 Permission denied") —
# саме тому state.json, судячи з усього, взагалі не оновлювався
# відколи існує бот, і охолодження Gate-тригера ніколи не зберігалось.
permissions:
  contents: write

on:
  # ── Автоматичний запуск за розкладом (UTC час)
  # GitHub може затримувати cron до ~5 хв при навантаженні — це нормально
  schedule:
    - cron: "0,15,30,45 * * * *"   # кожні 15 хвилин

  # ── Ручний запуск через вкладку Actions на GitHub (для тестування)
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12            # аварійний таймаут на випадок зависання

    steps:
      # ── Крок 1: клонуємо репозиторій разом з state.json (якщо вже є)
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── Крок 2: встановлюємо Python 3.11
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Крок 3: встановлюємо залежності (лише requests — стандартна бібліотека)
      - name: Install dependencies
        run: pip install requests

      # ── Крок 4: запускаємо сканер з секретами Telegram + Gate-тригера
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          GATE_DISPATCH_TOKEN:  ${{ secrets.GATE_DISPATCH_TOKEN }}
          GATE_TARGET_OWNER:    ${{ secrets.GATE_TARGET_OWNER }}
        run: python scanner.py

      # ── Крок 5: зберігаємо оновлений state.json назад у репозиторій
      # Це дозволяє середні об'єми та Gate-охолодження зберігатися між запусками.
      #
      # ВИПРАВЛЕНО 13.08.2026: раніше "git push ... || true" МОВЧКИ
      # ковтав помилку push — якщо push не проходив, оновлений
      # state.json (з gate_cooldown) губився, і символи, що мали бути
      # заблоковані охолодженням, знову тригерили Gate_PICT_bot.
      # Тепер: pull --rebase перед push (як і в OKX_PA3OM_3_bot) +
      # до 3 спроб push з паузою, і якщо всі спроби провалились —
      # workflow явно ЗАВЕРШУЄТЬСЯ З ПОМИЛКОЮ (видно в Actions),
      # а не мовчки "успішно".
      - name: Save state to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          git diff --staged --quiet || git commit -m "update state"

          for i in 1 2 3; do
            git pull origin main --rebase --strategy-option=theirs
            if git push origin main; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push failed on attempt $i, retrying..."
            sleep 5
          done
          echo "::error::Push failed after 3 attempts — state.json NOT saved!"
          exit 1